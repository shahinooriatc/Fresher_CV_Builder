<head>

  <meta name="theme-color" content="#eef2f8">
  <!-- Sets the dark theme before the page paints, so there is no white flash -->
  <script>(function(){try{var t=localStorage.getItem("cvb:theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark")}catch(e){}})()</script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
